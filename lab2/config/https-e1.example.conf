# Plantilla Apache 2.4/XAMPP. NO incluir sin completar rutas, SAN y subred.
# Modulos requeridos: ssl, socache_shmcb, proxy, proxy_http, authz_host.
# PHP sigue en 127.0.0.1:18082; no cambiar demo.ps1 ni exponer ese puerto a LAN.
# La clave y la CA se generan fuera del repositorio y del DocumentRoot.
Listen 8443 https
<VirtualHost *:8443>
    ServerName telemetry.example.invalid
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "C:/RUTA_PRIVADA/server.crt"
    SSLCertificateKeyFile "C:/RUTA_PRIVADA/server.key"
    ProxyRequests Off
    ProxyTimeout 10
    <Location "/">
        Require all denied
    </Location>
    <LocationMatch "^/api/v1/telemetry$">
        # Sustituir por la IP del ESP32 reservada por DHCP o la subred del laboratorio.
        Require ip 192.168.1.0/24
    </LocationMatch>
    ProxyPass "/api/v1/telemetry" "http://127.0.0.1:18082/api/v1/telemetry" connectiontimeout=3 timeout=10
    ProxyPassReverse "/api/v1/telemetry" "http://127.0.0.1:18082/api/v1/telemetry"
    # Sin URL, cabeceras Authorization ni cuerpos en los logs.
    CustomLog "logs/e1-access.log" "%t %>s %D"
    ErrorLog "logs/e1-error.log"
    LogLevel warn
</VirtualHost>
